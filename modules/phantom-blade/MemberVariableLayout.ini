; Phantom Blade Zero Steam build 26266538, executable hash pinned by the client.
; Verified native allocation/indexing and read-only runtime object inspection.
; See docs/phantom-blade-loader.md and the pinned UE4SS MacroSetter.hpp.
; Array offsets are relative to FUObjectArray.ObjObjects (normal offset 0x10).
; FUObjectItem uses the normal UE5.7 layout: size 0x18, Object at 0x8.
[TUObjectArray]
MaxChunks = 0x0
NumChunks = 0x4
Objects = 0x8
NumElements = 0x10
MaxElements = 0x14
PreAllocatedObjects = 0x18
UEP_TotalSize = 0x20

; The linked-list pointer and tagged owner are reversed from stock UE5.7.
[FField]
Next = 0x10
Owner = 0x18

; Native field-class constructor dispatch and decoded live type metadata agree.
[FFieldClass]
ConstructFn = 0x0
CastFlags = 0x10
Id = 0x18
Name = 0x30

; PBZ adds data at 0x58..0xA7 before these struct members.
[UStruct]
PropertiesSize = 0xA8
MinAlignment = 0xAC
StructStateFlags = 0xAE
Script = 0xB0
PropertyLink = 0xC0
RefLink = 0xC8
DestructorLink = 0xD0
PostConstructLink = 0xD8
UEP_TotalSize = 0x100

[UFunction]
FunctionFlags = 0x100
NumParms = 0x104
ParmsSize = 0x106
ReturnValueOffset = 0x108
FirstPropertyToInit = 0x110
EventGraphFunction = 0x118
EventGraphCallOffset = 0x120
Func = 0x128
UEP_TotalSize = 0x130

; Class flags and default objects agree across seven native class/CDO pairs.
[UClass]
ClassFlags = 0x124
ClassCastFlags = 0x128
ClassDefaultObject = 0x160
FuncMap = 0x180
FuncMapLock = 0x1D0
AllFunctionsCache = 0x1D8
AllFunctionsCacheLock = 0x228
UEP_TotalSize = 0x258

; Native CppStructOps size/alignment agree for GameplayAttribute/Data and Vector.
[UScriptStruct]
StructFlags = 0x100
bPrepareCppStructOpsCompleted = 0x104
CppStructOps = 0x108
UEP_TotalSize = 0x110
